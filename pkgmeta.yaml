package-as: DevSuite
# --------------------------
enable-nolib-creation: no
license-output: LICENSE.txt

required-dependencies:
  - DebugChatFrame

embedded-libraries:
  - LibStub
  - Ace3
  - LibUtil
  - LibPrettyPrint

tools-used:
  - DevSuite
  - Bugsack
  - Bug-Grabber

externals:
  DevSuite/ThirdParty/Libs/Ace3:
    url: https://github.com/WoWUIDev/Ace3
    tag: latest
  DevSuite/ThirdParty/Libs/LibPrettyPrint:
    url: https://github.com/kapresoft/wow-addon-LibPrettyPrint
    tag: latest
  DevSuite/ThirdParty/Libs/Kapresoft-LibUtil:
    url: https://github.com/kapresoft/wow-lib-util
    tag: latest

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.toml"
  - dev
  - doc
  - scripts
  - DevSuite/ThirdParty/Libs/Ace3/changelog.txt
  - DevSuite/ThirdParty/Libs/Ace3/Ace3.lua
  - DevSuite/ThirdParty/Libs/Ace3/Ace3.toc
  - DevSuite/ThirdParty/Libs/Ace3/tests
  - DevSuite/ThirdParty/Libs/Ace3/Bindings.xml
  - DevSuite/ThirdParty/Libs/Ace3/README.md
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/dev
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/*.md
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/*.yaml
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/*.sh
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-1-0
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/*.toc
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.lua
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.xml
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Assets
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ThirdParty
  - DevSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Annotations
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/dev
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/doc
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/Assets
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/ThirdParty
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/LibPrettyPrint.xml
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/Libs/Developer/*.xml
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/Libs/Developer/Developer*.lua
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/Libs/Annotations
  - DevSuite/ThirdParty/Libs/LibPrettyPrint/*.toc


# REQUIRED for CurseForge packager (non-obvious):
# The LEFT side MUST be <repo-folder>/<addon-folder>
#   - <addon-folder> MUST be the folder that contains the .toc files
# The RIGHT side MUST be the addon name:
#   - Must match the .toc filename (AddonName.toc)
#   - Must match `package-as`
#
# NOTE:
# CurseForge release.sh (poorly) relies on `move-folders` for *addon discovery*,
# not just post-processing. If this does not exactly match
# <repo>/<addon>, `toc_root_paths` will be empty and packaging WILL fail.
#
# ⚠️ Do not change unless you also change the repo/addon layout.
# Base path is .release/
move-folders:
  DevSuite/DevSuite: DevSuite
