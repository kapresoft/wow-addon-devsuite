# This is used for development to pull external libraries.
# @see also: ./dev/pull-extlib.sh
# --------------------------
# cmd: ./dev/release.sh -duz -r ./.release -m _setup.yml
# Note: This will build in ./.release/_setup directory
package-as: _setup
# --------------------------
# Reuses dev/changelog-release.md. release-build.yml overwrites it at
# release time for the packager to read, but never commits that change back,
# so the tracked copy here always stays blank.
manual-changelog:
  filename: dev/changelog-release.md
  markup-type: markdown

# Use GitHub because svn repos are slower
# basepath is ${package-as}
# Ace3:
#  - This is faster: https://github.com/WoWUIDev/Ace3
#  - But this is the official: https://repos.wowace.com/wow/ace3/trunk
# alts to tag: latest are:
#    main: branch
#    commit: <hash>
externals:
  # r1424-alpha (Release-r1403 + 21), needed for WoW Forever
  ThirdParty-Libs/Ace3:
    url: https://github.com/WoWUIDev/Ace3
    commit: ac3d1225037e0dc74e025a72342c0f7824aae147
  ThirdParty-Libs/LibPrettyPrint:
    url: https://github.com/kapresoft/wow-addon-LibPrettyPrint
    tag: latest
  ThirdParty-Libs/LibTraceKit:
    url: https://github.com/kapresoft/wow-addon-LibTraceKit
    tag: latest
  ThirdParty-Libs/Kapresoft-LibUtil:
    url: https://github.com/kapresoft/wow-lib-util
    tag: latest
  ThirdParty-Libs/LibAceOptionsKit:
    url: https://github.com/kapresoft/wow-addon-LibAceOptionsKit
    tag: latest

  ## annotations always get pulled from main
  ThirdParty-Libs/Annotations/Kapresoft-LibUtil:
    url: https://github.com/kapresoft/wow-lib-util
    path: Lib-2-0/Annotations
  ThirdParty-Libs/Annotations/LibPrettyPrint:
    url: https://github.com/kapresoft/wow-addon-LibPrettyPrint
    path: Libs/Annotations
  ThirdParty-Libs/Annotations/DebugChatFrame:
    url: https://github.com/kapresoft/wow-addon-debug-chat-frame
    path: Libs/Annotations
  ThirdParty-Libs/Annotations/LibAceOptionsKit:
    url: https://github.com/kapresoft/wow-addon-LibAceOptionsKit
    path: Libs/Annotations

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.yml"
  - "*.toc"
  - "*.toml"
  - dev
  - doc
  - LICENSE
  - CHANGELOG.md
  - DevSuite/Libs
  - DevSuite/Bindings.xml
  - DevSuite/DevSuite.lua
  - DevSuite/DevSuite.xml
  - DevSuite/ThirdParty/Ace3.xml
  - DevSuite/ThirdParty/ThirdParty.xml
  - ThirdParty-Libs/Ace3/Ace3.lua
  - ThirdParty-Libs/Ace3/Bindings.xml
  - ThirdParty-Libs/Ace3/*.txt
  - ThirdParty-Libs/LibPrettyPrint/*.sh
  - ThirdParty-Libs/LibPrettyPrint/LibPrettyPrint.xml
  - ThirdParty-Libs/LibPrettyPrint/Assets
  - ThirdParty-Libs/LibPrettyPrint/dev
  - ThirdParty-Libs/LibPrettyPrint/doc
  - ThirdParty-Libs/LibPrettyPrint/ThirdParty
  - ThirdParty-Libs/LibPrettyPrint/LICENSE
  - ThirdParty-Libs/LibPrettyPrint/Libs/Developer
  - ThirdParty-Libs/LibPrettyPrint/Libs/Annotations
  - ThirdParty-Libs/LibTraceKit/dev
  - ThirdParty-Libs/LibTraceKit/doc
  - ThirdParty-Libs/LibTraceKit/Libs/Assets
  - ThirdParty-Libs/LibTraceKit/Libs/Developer.lua
  - ThirdParty-Libs/LibTraceKit/ThirdParty
  - ThirdParty-Libs/Kapresoft-LibUtil/dev
  - ThirdParty-Libs/Kapresoft-LibUtil/LICENSE
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-1-0
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-2-0/Annotations
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-2-0/Assets
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-2-0/ThirdParty
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.lua
  - ThirdParty-Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.xml
  - ThirdParty-Libs/LibAceOptionsKit/LICENSE
  - ThirdParty-Libs/LibAceOptionsKit/*.toc
  - ThirdParty-Libs/LibAceOptionsKit/dev
  - ThirdParty-Libs/LibAceOptionsKit/doc
  - ThirdParty-Libs/LibAceOptionsKit/Assets
  - ThirdParty-Libs/LibAceOptionsKit/LibAceOptionsKit.xml
  - ThirdParty-Libs/LibAceOptionsKit/ThirdParty
  - ThirdParty-Libs/LibAceOptionsKit/Libs/Annotations
  - ThirdParty-Libs/LibAceOptionsKit/Libs/Developer


# Base path is .release/
move-folders:
  _setup/ThirdParty-Libs: ../DevSuite/ThirdParty/Libs
